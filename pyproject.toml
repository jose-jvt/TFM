[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tarp-segmentation"
version = "0.1.0"
description = "Geospatial tarp segmentation for post-disaster building damage assessment"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3.1",
    "shapely>=2.0.2",
    "opencv-python>=4.8.1",
    "mlflow>=2.9.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "geopandas>=0.14.1",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.1",
    "scipy>=1.11.4",
    "pillow>=10.1.0",
    "omegaconf>=2.3.0",
    "timm>=0.9.12",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["segmentation*", "building_analysis*", "area_analysis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
