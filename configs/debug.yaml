experiment:
  name: "debug_run"
  mlflow_tracking_uri: "mlruns"
  seed: 42

data:
  train_csv: "dataset/train.csv"
  val_csv:   "dataset/val.csv"
  test_csv:  "dataset/test.csv"
  metadata_dir: "dataset/metadata"
  image_size: 256         # resize to 512x512 – fast on CPU, representative of real data
  task: "binary"
  class_mapper: null
  max_samples: 20         # use only 20 images per split for quick debugging
  num_workers: 0          # 0 = main process only, safe on macOS/MPS; use 8-16 on Linux/A100

model:
  architecture: "unet"
  encoder: "resnet18"     # lightest encoder, no pretrained download needed
  pretrained: false
  in_channels: 3
  num_classes: 1

training:
  epochs: 3
  batch_size: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  loss_config: "configs/losses/dice_bce.json"
  mixed_precision: false     # set true on CUDA (A100) for faster training
  compile: false             # set true on CUDA (A100, PyTorch ≥ 2.0) for ~20% extra speed
  early_stopping_patience: 5
  scheduler: null
  grad_clip: 1.0

augmentation:
  enabled: false

inference:
  threshold: 0.5
  output_dir: "outputs/debug_predictions"
  save_overlay: false

building_analysis:
  min_building_area_px: 50
  output_dir: "outputs/building_scores"

area_analysis:
  output_dir: "outputs/area_analysis"
