experiment:
  name: "unet_resnet34_binary_baseline"
  mlflow_tracking_uri: "mlruns"
  seed: 42

data:
  # Pre-split CSVs (generated by segmentation/dataset/generate_splits.py)
  train_csv: "dataset/train.csv"
  val_csv:   "dataset/val.csv"
  test_csv:  "dataset/test.csv"
  # Optional: path to the metadata/ subfolder (used for tile geo-bounds in area analysis)
  metadata_dir: "dataset/metadata"
  # null = keep original resolution (1024 or 2048), batches grouped by resolution automatically
  # Set an integer (e.g. 1024) to resize everything to a square
  image_size: null
  # "binary"     → mask is binarised (any tarp class → 1)
  # "multiclass" → mask class IDs are used as-is (0=bg, 1-6=tarp classes)
  task: "binary"
  # Regex to extract year/region/tile from the image filename (used in area analysis)
  filename_pattern: "(?P<region>[A-Z\\-]+)_(?P<year>\\d{4})_(?P<image_type>[A-Z]+)_(?P<tile>\\d+)"

model:
  architecture: "unet"
  encoder: "resnet34"
  # true  = ImageNet pretrained encoder
  # false = random initialisation
  pretrained: true
  in_channels: 3
  # 1 for binary (BCEWithLogits), N for multiclass (CrossEntropy/Dice)
  num_classes: 1

training:
  epochs: 100
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  # "bce" | "dice" | "focal" | "dice_bce"
  loss: "dice_bce"
  focal_gamma: 2.0
  # Per-class weights list [bg, blue, black, green, white, repair, other] for multiclass
  class_weights: null
  early_stopping_patience: 15
  # "cosine" | "step" | "plateau" | null
  scheduler: "cosine"
  grad_clip: 1.0

augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: true
  random_rotate_90: true
  brightness_contrast: true
  brightness_limit: 0.2
  contrast_limit: 0.2

inference:
  threshold: 0.5
  output_dir: "outputs/predictions"
  save_overlay: true

building_analysis:
  min_building_area_px: 50
  output_dir: "outputs/building_scores"

area_analysis:
  output_dir: "outputs/area_analysis"
